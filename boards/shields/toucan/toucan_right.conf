CONFIG_ZMK_POINTING=y

CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Fastest BLE connection interval (7.5ms), no skipped events — prevents trackpad
# events from batching over BLE which causes cursor teleport on finger lift
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=6
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=600

# The pinnacle driver also requires this to include sleep code
CONFIG_ZMK_MOUSE=y

CONFIG_ZMK_BATTERY_REPORTING=y
# CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
# CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Touchpad autosleep: chip itself sleeps after ~5s with no touches (see `sleep;` on
# the glidepoint node in the overlay) instead of scanning at 100Hz nonstop between
# touches. ~300ms wake latency on next touch, but worth it now that deep sleep is
# 5 min instead of 1 hour — without this the chip burned power the whole 5 min gap.
CONFIG_ZMK_INPUT_PINNACLE_IDLE_SLEEPER=y

# Enter deep sleep https://zmk.dev/docs/features/low-power-states
CONFIG_ZMK_SLEEP=y

# Right half is the peripheral: its "reconnect" is just the peripheral<->central
# split link re-pairing automatically in the background, not the user re-bonding
# to the host, so the "avoid deep sleep, it's annoying to reconnect" tradeoff that
# justifies a long timeout on the central does not apply here. Sleep aggressively
# to save battery — 5 minutes idle before deep sleep.
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=300000

CONFIG_ZMK_IDLE_TIMEOUT=30000

# We use this because we need ZMK_PM, PM_DEVICE and ZMK_PM_DEVICE_SUSPEND_RESUME to get proper sleep notifications into the cirque driver
# since we need all that might as well also turn on SOFT_OFF (which implies all these things but adds an optional SOFT_OFF feature)
CONFIG_ZMK_PM_SOFT_OFF=y

# Dedicated gesture work queue stack — 6KB gives margin for ZMK kscan→split→BLE call chain
# including deep error-handling paths under BLE retransmit pressure at long range
CONFIG_ZMK_INPUT_PERIPHERAL_GESTURE_WORKQ_STACK_SIZE=6144

# INPUT THREAD calls zmk_kscan_touch_report→kscan_composite→ZMK keyboard→bt_gatt_notify on
# every touch start.  Under poor BLE signal, bt_gatt_notify's error-handling path is deeper
# than the success path; with the default 1024B stack this overflows at range → HardFault.
# Left half already sets this to 4096 for the same reason.
CONFIG_INPUT_THREAD_STACK_SIZE=4096

# More ACL TX buffers so retransmissions at long range don't exhaust the pool and cause
# bt_gatt_notify to return -ENOMEM, which stresses ZMK's split state machine.
CONFIG_BT_BUF_ACL_TX_COUNT=10

